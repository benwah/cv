name: Build PDFs
on:
  push:
    branches: [gh-pages]
    paths: ["index.md", "english/index.md", "_layouts/default.html", "build_pdf.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install markdown
      - run: python build_pdf.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add *.pdf
          git diff --cached --quiet || (git commit -m "Update PDFs" && git push)
