<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: "Benoit Clennett-Sirois" }}</title>
    <style>
      body { margin: 0; background: #fff; color: #222; font: 17px/1.6 Georgia, "Times New Roman", serif; }
      .main-content { max-width: 760px; margin: 0 auto; padding: 56px 24px 80px; }
      h1 { font-size: 2.3em; margin: 0 0 .3em; letter-spacing: .01em; }
      h2 { font-size: 1.15em; text-transform: uppercase; letter-spacing: .12em; color: #1f3a5f; border-bottom: 1px solid #ccd3dc; padding-bottom: .25em; margin: 2em 0 .8em; }
      h3 { font-size: 1.15em; margin: 1.6em 0 .2em; }
      p { margin: .6em 0; }
      ul { padding-left: 1.3em; margin: .5em 0; }
      li { margin: .3em 0; }
      a { color: #1f3a5f; text-decoration: none; border-bottom: 1px solid #b5c0d0; }
      a:hover { border-bottom-color: #1f3a5f; }
      hr { border: 0; border-top: 1px solid #e3e6ea; margin: 2em 0; }
      em { color: #555; }
      .pdf-btn { float: right; font: 14px/1 sans-serif; color: #1f3a5f; background: #fff; border: 1px solid #b5c0d0; border-radius: 4px; padding: 8px 12px; cursor: pointer; }
      .pdf-btn:hover { background: #f1f4f8; }
      @media print { .pdf-btn { display: none; } .main-content { padding: 0; max-width: none; } body { font-size: 11pt; } a { border: 0; } }
    </style>
  </head>
  <body>
    <div class="main-content">
      <button class="pdf-btn" onclick="window.print()">{% if page.url contains 'english' %}Download as PDF{% else %}Télécharger en PDF{% endif %}</button>
      {{ content }}
    </div>
  </body>
</html>
