<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      .wrapper {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
      }
      header {
        display: none !important;
      }
      section {
        width: 100% !important;
        float: none !important;
      }
      
      /* Completely neutralize the theme's flex/space-between rules on all header text elements */
      section h1 + p, 
      section h1 + p + p, 
      section h1 + p + p + p {
        display: block !important;
        width: 100% !important;
        float: none !important;
        clear: both !important;
        justify-content: flex-start !important;
        align-items: stretch !important;
        margin-bottom: 12px !important;
      }

      /* Force any flex containers generated by the theme inside the intro to collapse */
      section p {
        display: block !important;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      {{ content }}
    </div>
  </body>
</html>
