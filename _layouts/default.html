<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      .wrapper {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
      }
      header {
        display: none;
      }
      section {
        width: 100% !important;
        float: none !important;
      }
      /* Clean up the header layout to prevent awkward stretching */
      h1 {
        margin-bottom: 5px;
      }
      /* Fix tables or grid artifacts if the theme treats text blocks as tables */
      table, tr, td, th {
        border: none !important;
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      {{ content }}
    </div>
  </body>
</html>
