<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <style>
      .wrapper {
        max-width: 800px;
        margin: 0 auto;
        padding: 40px 20px;
      }
      header {
        display: none;
      }
      section {
        width: 100% !important;
        float: none !important;
      }
      h1 {
        margin-bottom: 5px;
      }
      /* Force header text lines to stack normally and stop them from stretching apart */
      section > p {
        display: block !important;
        width: 100% !important;
        word-spacing: normal;
      }
      /* Fix any theme-specific flex/space-between behavior on paragraphs near the top */
      section > p strong, section > p, section > p a {
        justify-content: flex-start !important;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      {{ content }}
    </div>
  </body>
</html>
